services:

  prometheus:
    image: prom/prometheus:latest
    container_name: xqora-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: xqora-node-exporter
    ports:
      - "9100:9100"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: xqora-grafana
    ports:
      - "3000:3000"
    restart: unless-stopped
